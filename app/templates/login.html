<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixtape Share — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Coda:wght@400;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  .login-page { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#fffcf2; }
  .login-box { background:#fff; border:1px solid #ccc5b9; border-radius:6px; padding:2.5rem; width:90%; max-width:360px; box-shadow:0 4px 20px rgba(0,0,0,0.04); }
  .login-box h1 { font-size:1.3rem; margin-bottom:0.3rem; }
  .login-box p { color:#403d39; font-size:0.85rem; margin-bottom:1.5rem; }
  .login-box .form-group { margin-bottom:1rem; }
  .login-box input { width:100%; padding:0.65rem 0.75rem; border:1px solid #ccc5b9; border-radius:3px; font-family:'Coda',sans-serif; font-size:0.9rem; background:#fffcf2; }
  .login-box input:focus { outline:none; border-color:#eb5e28; }
  .login-box .btn-primary { width:100%; padding:0.65rem; }
  .error-msg { color:#D0021B; font-size:0.82rem; margin-bottom:0.8rem; }
  .login-footer { text-align:center; margin-top:1.2rem; font-size:0.8rem; color:#403d39; }
  .login-footer a { color:#eb5e28; text-decoration:none; }
</style>
</head>
<body class="login-page">
  <div class="login-box">
    <h1>📼 Mixtape Share</h1>
    <p>Sign in to manage your mixtapes</p>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    <form id="loginForm" onsubmit="login(event)">
      <div class="form-group">
        <input type="text" name="username" placeholder="Username" required autofocus>
      </div>
      <div class="form-group">
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>
    <div class="login-footer">
      Need an account? <a href="/register">Register</a>
    </div>
  </div>
<script>
async function login(e) {
  e.preventDefault();
  var fd = new FormData(e.target);
  try {
    var r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: fd.get('username'), password: fd.get('password')})
    });
    if (r.ok) { window.location.href = '/'; }
    else { var d = await r.json(); alert(d.error || 'Login failed'); }
  } catch(err) { alert('Connection error'); }
}
</script>
</body>
</html>
